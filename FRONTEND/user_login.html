<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> User Login - Shansha Artistry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
  <div class="logo">
    <img src="IMAGES/logo.jpg" alt="Shansha Artistry Logo"></div>
    <h1>Shansha Artistry</h1> 
  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="admin_login.html">Admin</a>
  </nav>
</header>

<div class="auth-container">

  <h2 id="formTitle"> User Login</h2>

  <input type="text" id="name" placeholder="Full Name" style="display:none;">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="handleAuth()">Login</button>

  <p id="toggleText">
    Don't have an account? 
    <span onclick="toggleForm()">Signup</span>
  </p>

</div>

<script>
let isLogin = true;

function toggleForm() {
  isLogin = !isLogin;

  document.getElementById("formTitle").innerText = isLogin ? "User Login" : "Signup";
  document.querySelector(".auth-container button").innerText = isLogin ? "Login" : "Signup";
  document.getElementById("name").style.display = isLogin ? "none" : "block";

  document.getElementById("toggleText").innerHTML = isLogin
    ? `Don't have an account? <span onclick="toggleForm()">Signup</span>`
    : `Already have an account? <span onclick="toggleForm()">Login</span>`;
}

async function handleAuth() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password || (!isLogin && !name)) {
    alert("Please fill all fields");
    return;
  }

  try {
    if (isLogin) {
      // LOGIN
      const res = await fetch("https://shansha-artistry.onrender.com/api/users/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (data.token) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("currentUser", JSON.stringify(data.user));
        alert("Login Successful!");
        window.location.href = "shop.html";
      } else {
        alert(data.msg || "Login failed");
      }
    } else {
      // SIGNUP
      const res = await fetch("https://shansha-artistry.onrender.com/api/users/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();

      alert(data.msg || "Signup failed");

      if (data.msg === "Signup successful") {
        toggleForm(); // login form par wapas
      }
    }
  } catch (err) {
    console.error(err);
    alert("Server se connection nahi hua. Backend chal raha hai?");
  }
}
</script>
</body>
</html>
